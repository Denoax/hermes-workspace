<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content"><title>Hermes Workspace</title><link rel="icon" href="/brand/hermes.png"><link rel="preload" href="/fonts/Inter-Medium.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="/fonts/Rubik.ttf" as="font" type="font/ttf" crossorigin><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/portfolio.css"><script type="module" src="/app.js"></script></head>
<body>
<a class="skip-link" href="#prompt">Skip to message</a>
<div class="app" id="app">
 <aside class="sidebar" aria-label="Workspace navigation">
  <div class="brand"><img src="/brand/hermes.png" width="32" height="32" alt="">Hermes</div>
  <button id="new-session" class="new-session wide" data-action="new-session">New conversation <span data-icon="plus" aria-hidden="true"></span></button>
  <button class="search-button wide" data-action="projects">Open project <kbd>Ctrl K</kbd></button>
  <nav aria-label="Projects"><div class="section-heading"><h2>Projects</h2><button id="new-project" class="icon-button" data-action="new-project" aria-label="New project"><span data-icon="plus" aria-hidden="true"></span></button></div><div id="projects"></div></nav>
  <nav class="sessions-nav" aria-label="Conversations"><div class="section-heading"><h2>Conversations</h2><button id="rename" class="text-button" data-action="rename" disabled>Rename</button></div><div id="sessions"></div></nav>
  <div class="sidebar-bottom"><button class="text-button wide" data-action="appearance">Settings <span data-icon="settings" aria-hidden="true"></span></button></div>
 </aside>
 <div class="workspace-body" id="workspace-body">
  <header class="toolbar">
   <button class="project-switch" data-action="projects"><span id="project-label">Choose project</span><span data-icon="chevron-down" aria-hidden="true"></span></button>
   <label class="sr-only" for="context">Context</label><select id="context"><option value="lab">Lab</option><option value="homebrew">Homebrew ↗</option></select>
   <div class="toolbar-actions"><button id="sound-toggle" type="button" class="icon-button sound-toggle" aria-label="Mute interface sounds" aria-pressed="true"><span class="sound-on" data-icon="volume-2" aria-hidden="true"></span><span class="sound-off" data-icon="volume-x" aria-hidden="true"></span></button><span id="connection" class="connection sr-only" role="status">Connecting…</span><nav class="portfolio-nav" aria-label="Workspace panels"><ul class="gooey-list"><li class="gooey-segment"><button id="files-toggle" class="gooey-label" data-action="files" aria-controls="files-panel" aria-expanded="false"><span data-icon="projects" aria-hidden="true"></span>Files</button></li><li class="gooey-segment"><button id="diagnostics" class="gooey-label" data-action="details" aria-controls="details" aria-expanded="false"><span data-icon="details" aria-hidden="true"></span>Details</button></li><li class="gooey-segment"><button id="settings-toggle" class="gooey-label" data-action="appearance" aria-controls="appearance" aria-expanded="false">Settings</button></li><li class="gooey-segment"><button id="homebrew-context" class="gooey-label" data-action="homebrew" aria-label="Open Homebrew"><span class="homebrew-label">Homebrew</span><span data-icon="arrow-up-right" aria-hidden="true"></span></button></li></ul></nav><button id="start-window" class="primary" data-action="start">Start lab</button><button id="stop" class="stop-button" data-action="stop" disabled title="No active job">Stop</button></div>
  </header>
  <main id="messages" class="conversation" aria-label="Conversation" aria-live="polite"></main>
  <div class="composer-wrap">
   <p id="composer-state" class="action-state sr-only" role="status"></p>
   <form id="composer" class="composer">
    <label class="sr-only" for="prompt">Message Hermes</label><textarea id="prompt" rows="3" maxlength="12000" placeholder="Message Hermes…"></textarea>
    <div class="composer-controls"><div class="composer-options"><label class="sr-only" for="arm">Model</label><select id="arm"><option value="normal">Normal Qwen</option><option value="abliterated">Abliterated Qwen</option></select><label class="sr-only" for="task-kind">Tool mode</label><select id="task-kind"><option value="chat">Chat</option><option value="python">Python task</option><option value="cpp">C++ task</option></select></div><button id="send" class="send-button" type="submit" aria-label="Send message" disabled><span data-icon="arrow-up" aria-hidden="true"></span></button></div>
   </form>
  </div>
 </div>
 <dialog id="files-panel" class="files-panel glass-window" aria-labelledby="files-title">
  <div class="drawer-heading"><h2 id="files-title">Files</h2><button id="files-close" class="icon-button pane-close" data-action="close-files" aria-label="Close files"><span data-icon="close" aria-hidden="true"></span></button></div>
  <div class="file-tabs" role="tablist" aria-label="File review"><button id="files-tab" role="tab" aria-selected="true" aria-controls="file-content" data-action="files-tab">Files</button><button id="changes-tab" role="tab" aria-selected="false" aria-controls="changes-content" data-action="changes-tab">Changes</button></div>
  <section id="file-content" role="tabpanel" aria-labelledby="files-tab"><div class="file-actions"><button id="new-file" class="text-button" data-action="new-file">New file</button><button id="import" class="text-button" data-action="import">Import folder</button><button id="open-folder" class="icon-button" data-action="open-folder" aria-label="Open project folder"><span data-icon="arrow-up-right" aria-hidden="true"></span></button></div><div id="tree" aria-label="Project files"></div><p id="no-files" class="quiet">Choose a project to view files.</p>
   <div id="file-preview" class="file-preview" hidden><div class="file-preview-heading"><span id="file-label"></span><span id="file-state" class="quiet">Workspace copy</span></div><label class="sr-only" for="file-text">File content</label><textarea id="file-text" spellcheck="false"></textarea><button id="save-file" class="text-button" data-action="save-file">Save copy</button></div>
  </section>
  <section id="changes-content" role="tabpanel" aria-labelledby="changes-tab" hidden><p id="validation" class="quiet">Select a completed job to review its changes.</p><button id="view-diff" class="text-button" data-action="diff" disabled>Review diff</button><pre id="diff"></pre><button id="apply" class="primary" data-action="apply" hidden>Apply selected change</button></section>
  <p id="file-error" class="error" role="alert" hidden></p>
 </dialog>
</div>
<dialog class="glass-window" id="project-dialog" aria-labelledby="project-title"><div class="dialog-heading"><h2 id="project-title">Projects</h2><button class="icon-button pane-close" data-action="close-dialog" aria-label="Close projects"><span data-icon="close" aria-hidden="true"></span></button></div><label class="sr-only" for="project-search">Search projects</label><input id="project-search" type="search" placeholder="Search projects" autocomplete="off"><div id="project-results"></div><button class="primary wide" data-action="new-project">New project <span data-icon="plus" aria-hidden="true"></span></button><div class="mobile-conversations"><div class="section-heading"><h3>Conversations</h3><button class="text-button" data-action="rename">Rename</button></div><div id="mobile-sessions"></div><button class="text-button wide" data-action="new-session">New conversation <span data-icon="plus" aria-hidden="true"></span></button><button class="text-button wide" data-action="appearance">Settings <span data-icon="settings" aria-hidden="true"></span></button></div></dialog>
<dialog class="glass-window" id="input-dialog" aria-labelledby="input-title"><form id="input-form"><div class="dialog-heading"><h2 id="input-title"></h2><button class="icon-button pane-close" type="button" data-action="close-dialog" aria-label="Close"><span data-icon="close" aria-hidden="true"></span></button></div><label id="input-label" for="input-value"></label><input id="input-value" required autocomplete="off"><p id="input-error" class="error" role="alert" hidden></p><button id="input-submit" type="submit" class="primary wide">Create</button></form></dialog>
<dialog class="glass-window" id="appearance" aria-labelledby="appearance-title"><div class="dialog-heading"><h2 id="appearance-title">Settings</h2><button class="icon-button pane-close" data-action="close-dialog" aria-label="Close settings"><span data-icon="close" aria-hidden="true"></span></button></div><div class="settings-theme"><span>Theme</span><button id="theme-buddy" class="theme-toggle" type="button" aria-label="Light mode" aria-pressed="true"></button></div><select id="theme" hidden aria-hidden="true" tabindex="-1"><option value="dark">Dark</option><option value="light">Light</option></select>
<label class="owned-range" for="interface-brightness"><span class="range-label">Brightness <output for="interface-brightness">100%</output></span><input id="interface-brightness" type="range" min="80" max="140" value="100" aria-label="Interface brightness"><svg aria-hidden="true"><line class="slider-track" x1="12" y1="46" y2="46"/><line class="slider-fill" x1="12" y1="46" y2="46"/><path class="slider-tether"/><path class="slider-trajectory"/><ellipse class="slider-thumb" rx="6" ry="6"/></svg></label>
<label class="owned-range" for="interface-volume"><span class="range-label">Sound volume <output for="interface-volume">12%</output></span><input id="interface-volume" type="range" min="0" max="100" value="12" aria-label="Interface sound volume"><svg aria-hidden="true"><line class="slider-track" x1="12" y1="46" y2="46"/><line class="slider-fill" x1="12" y1="46" y2="46"/><path class="slider-tether"/><path class="slider-trajectory"/><ellipse class="slider-thumb" rx="6" ry="6"/></svg></label>
<label class="motion-switch" for="less-motion"><span>Less motion</span><input id="less-motion" type="checkbox" role="switch"></label><select id="motion" hidden aria-hidden="true" tabindex="-1"><option value="system">Follow system</option><option value="reduced">Reduced</option></select><button id="reset-settings" class="settings-reset" type="button">Reset settings</button></dialog>
<dialog class="glass-window" id="details" aria-labelledby="details-title"><div class="dialog-heading"><h2 id="details-title">Details</h2><button class="icon-button pane-close" data-action="close-dialog" aria-label="Close details"><span data-icon="close" aria-hidden="true"></span></button></div><div id="details-summary"></div><p class="source-credit"><a href="https://www.rareui.com/components/gooeynav" target="_blank" rel="noopener noreferrer">Navigation by Rare UI</a></p><pre id="details-text"></pre></dialog>
<div id="notice" class="toast" role="status" hidden></div>
</body></html>
